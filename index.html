<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>복습</title>
<style>
  :root{
    --bg:#F3F4F6;--card:#FFFFFF;--ink:#111827;--mute:#6B7280;--line:#E5E7EB;
    --indigo:#4F46E5;--indigo-d:#3730A3;--green:#059669;--green-bg:#ECFDF5;
    --amber:#D97706;--amber-bg:#FFFBEB;--red:#DC2626;--red-bg:#FEF2F2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;}
  .wrap{max-width:480px;margin:0 auto;padding:0 0 64px;}
  header{position:relative;background:linear-gradient(135deg,#4F46E5,#6366F1);color:#fff;padding:22px 20px 18px;
    border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(79,70,229,.25);}
  .hd-date{font-size:15px;opacity:.9;font-weight:500;}
  .hd-top{display:flex;align-items:center;justify-content:space-between;}
  .hd-icons{display:flex;gap:2px;}
  .hicon{width:32px;height:32px;border:none;background:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;opacity:.95;}
  .hicon svg{width:18px;height:18px;}
  .hicon.spin svg{animation:hrot 1s linear infinite;}
  @keyframes hrot{to{transform:rotate(360deg)}}
  .hd-title{font-size:24px;font-weight:800;margin-top:2px;letter-spacing:-.5px;}
  .hd-prog-row{display:flex;align-items:center;gap:9px;margin-top:11px;}
  #hdBadge{font-size:13px;font-weight:700;flex:0 0 auto;}
  .hd-prog{flex:1;height:5px;background:rgba(255,255,255,.22);border-radius:999px;overflow:hidden;}
  .hd-prog i{display:block;height:100%;width:0;background:#fff;border-radius:999px;transition:width .3s;}
  .bars{display:flex;gap:3px;align-items:flex-end;height:36px;}
  .bars .b{flex:1;border-radius:3px;cursor:pointer;min-width:0;}
  .bar-detail{font-size:12px;font-weight:700;color:rgba(255,255,255,.96);margin-top:5px;min-height:15px;}
  @media(min-width:760px){
    #secHeat,#secPace{display:none;}
    #secPace.show{display:block;}
  }
  .hd-mini{display:none;}
  @media(min-width:760px){
    .hd-body{display:flex;align-items:stretch;gap:26px;}
    .hd-left{flex:0 0 auto;min-width:220px;display:flex;flex-direction:column;justify-content:space-between;padding:3px 0 6px;}
    .hd-mini{display:flex;flex-direction:column;justify-content:center;gap:9px;flex:1;min-width:0;}
    .hdm-pace{display:flex;gap:8px;align-items:stretch;}
    .hdm-cell{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 14px;backdrop-filter:blur(4px);}
    .hdm-cell.bad{background:rgba(220,38,38,.40);}
    .hdm-cell.ok{background:rgba(5,150,105,.38);}
    .hdm-cell.edit{cursor:pointer;}
    .hdm-k{font-size:12px;font-weight:700;opacity:1;}
    .hdm-v{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-top:1px;}
    .hdm-v small{font-size:12px;font-weight:700;opacity:.9;margin-left:2px;}
    .hdm-empty{flex:1;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);border-radius:12px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;}
    .judge{justify-content:flex-end;}
    .judge button{flex:0 0 170px;}
  }
  section{margin:18px 16px 0;}
  .sec-label{font-size:13px;font-weight:700;color:var(--mute);margin:0 4px 9px;letter-spacing:.2px;}
  .card{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden;}

  /* ---- 레이아웃: 좁으면 단일 컬럼(기존 순서), 넓으면(아이패드 가로) 2컬럼 ---- */
  .cols{display:flex;flex-direction:column;}
  .col-main,.col-side{display:contents;}
  #secHeat{order:1;}#secPace{order:2;}#secList{order:3;}#secAdd{order:4;}
  .toggles{order:5;}#statsPanel{order:6;}#managePanel{order:7;}
  @media(min-width:760px){
    .wrap{max-width:1060px;}
    .cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:0;align-items:start;}
    .col-main{display:block;min-width:0;}
    .col-side{display:block;min-width:0;position:sticky;top:10px;padding-bottom:24px;}
    .col-side>section:first-child{margin-top:0;}
  }

  /* ---- heatmap: 과거 = 무채색(수행량) · 미래 = 인디고(예정량) ---- */
  .hm-card{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:14px 12px 10px;}
  .hm-card .bar-detail{color:#4B5563;font-size:12.5px;margin-top:8px;min-height:17px;}

  /* ---- pace ---- */
  .pace-card{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:14px 16px;cursor:pointer;}
  .pace-big{font-size:21px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .pace-big.ok{color:var(--green);} .pace-big.bad{color:var(--red);}
  .edit-mark{font-size:13px;color:#C7D2FE;font-weight:700;flex:0 0 auto;}
  .pace-sub{font-size:12.5px;color:var(--mute);font-weight:600;margin-top:3px;}
  .pace-empty{font-size:14.5px;font-weight:700;color:var(--mute);display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .pace-edit{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:12px;}
  .pace-edit.open{display:block;}
  .pe-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .pe-row label{flex:0 0 76px;font-size:12.5px;font-weight:700;color:#374151;}
  .pe-row input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:15px;font-family:inherit;color:var(--ink);outline:none;background:#fff;}
  .pe-row input:focus{border-color:var(--indigo);}
  #metaSave{width:100%;border:none;background:var(--indigo);color:#fff;font-weight:800;font-size:15px;padding:11px;border-radius:10px;cursor:pointer;margin-top:2px;}

  /* ---- chips ---- */
  .chips{display:flex;gap:6px;overflow-x:auto;padding:0 2px 9px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;background:#fff;color:var(--mute);border:1.5px solid var(--line);cursor:pointer;}
  .chip.on{background:var(--indigo);color:#fff;border-color:var(--indigo);}

  /* ---- list ---- */
  .grp-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 3px;font-size:12px;font-weight:800;color:var(--indigo-d);letter-spacing:.3px;}
  .grp-head span{color:#9CA3AF;font-weight:700;}
  .grp-head b{font-weight:700;color:#8B93C8;margin-left:4px;}
  .grp-head.grp-done{color:#9CA3AF;border-top:1px solid var(--line);margin-top:2px;}
  .item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;}
  .item:last-child{border-bottom:none;}
  .item:active,.item.judging{background:#F9FAFB;}
  .item.judging{border-bottom:none;}
  .check{flex:0 0 26px;height:26px;border-radius:8px;border:2.4px solid #CBD5E1;background:#fff;display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .check svg{width:15px;height:15px;opacity:0;transform:scale(.5);transition:all .15s;}
  .item.done .check{background:var(--green);border-color:var(--green);}
  .item.done.weakr .check{background:var(--amber);border-color:var(--amber);}
  .item.done .check svg{opacity:1;transform:scale(1);}
  .it-body{flex:1;min-width:0;}
  .it-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .it-topic{color:var(--mute);font-weight:500;font-size:14px;}
  .it-lecs{font-size:12px;color:#9CA3AF;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item.judging .it-lecs{white-space:normal;}
  .item.done .it-name{color:#9CA3AF;text-decoration:line-through;}
  .it-meta{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap;}
  .it-right{display:flex;gap:5px;align-items:center;flex:0 0 auto;}
  .pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}
  .pill-stage{background:#EEF2FF;color:var(--indigo-d);}
  .pill-late{background:var(--red-bg);color:var(--red);}
  .pill-done{background:var(--green-bg);color:var(--green);}
  .pill-weak{background:var(--amber-bg);color:var(--amber);}
  .judge{display:flex;gap:8px;padding:4px 16px 14px 54px;border-bottom:1px solid var(--line);}
  .judge button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;padding:10px 0;
    font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;border:1.5px solid var(--line);background:#fff;transition:background .12s;}
  .judge button svg{width:15px;height:15px;}
  .jw{color:var(--amber);}
  .jw:active{background:var(--amber-bg);border-color:#FDE68A;}
  .jp{background:var(--green);border-color:var(--green);color:#fff;}
  .jp:active{background:#047857;border-color:#047857;}
  .undo{font-size:12px;color:var(--mute);font-weight:600;padding:6px 10px;border-radius:8px;background:#F3F4F6;flex:0 0 auto;}
  .day-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#EEF2FF;border-radius:12px;padding:9px 14px;margin-bottom:10px;font-size:13px;font-weight:700;color:var(--indigo-d);}
  .day-banner button{border:none;background:#fff;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;color:var(--indigo);cursor:pointer;font-family:inherit;box-shadow:0 1px 2px rgba(0,0,0,.08);flex:0 0 auto;}
  .res-pill{border:none;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;flex:0 0 auto;}
  .res-pill.rp{background:var(--green-bg);color:var(--green);box-shadow:inset 0 0 0 1.5px #A7F3D0;}
  .res-pill.rw{background:var(--amber-bg);color:var(--amber);box-shadow:inset 0 0 0 1.5px #FDE68A;}
  .sec-row{display:flex;align-items:center;justify-content:space-between;}
  .cal-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:32px;height:26px;color:#6B7280;cursor:pointer;}
  .cal-btn svg{width:16px;height:16px;}
  .cal-btn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}
  .empty{background:var(--card);border-radius:16px;padding:34px 20px;text-align:center;color:var(--mute);box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .empty .big{font-size:34px;margin-bottom:8px;}
  .empty .t{font-size:15px;font-weight:600;color:#374151;}

  /* ---- add + picker ---- */
  .inp-card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .inp-row{display:flex;gap:8px;}
  #name{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;font-size:16px;outline:none;font-family:inherit;color:var(--ink);}
  #name:focus{border-color:var(--indigo);}
  #topic{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 14px;font-size:15px;outline:none;font-family:inherit;color:var(--ink);margin-top:8px;}
  #topic:focus{border-color:var(--indigo);}
  #add{flex:0 0 auto;border:none;background:var(--indigo);color:#fff;font-weight:800;font-size:16px;padding:0 20px;border-radius:11px;cursor:pointer;}
  #add:active{background:var(--indigo-d);}
  .date-row{display:flex;align-items:center;gap:8px;margin-top:10px;padding:0 2px;}
  .date-row label{font-size:13px;color:var(--mute);font-weight:600;}
  #studied{border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;font-size:14px;font-family:inherit;color:var(--ink);outline:none;background:#fff;}
  #studied:focus{border-color:var(--indigo);}
  .date-hint{font-size:11.5px;color:#9CA3AF;margin:8px 2px 0;}
  .pk-toggle{text-align:center;margin-top:10px;}
  .pk-courses{padding:0 2px;margin:10px 0;}
  .pk-toggle button{background:none;border:none;color:var(--mute);font-size:13px;font-weight:600;cursor:pointer;padding:6px 8px;font-family:inherit;}
  #pickerPanel{display:block;}
  #manualPanel{display:none;margin-top:8px;}
  #manualPanel.open{display:block;}
  .date-card{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:10px;}
  .date-card label{font-size:13px;color:var(--mute);font-weight:600;flex:0 0 auto;}
  .dc-note{font-size:11px;color:#9CA3AF;margin-left:auto;text-align:right;}
  .pk-item{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#fff;}
  .pk-item:last-child{border-bottom:none;}
  .pk-item.full{opacity:.45;}
  .pk-body{flex:1;min-width:0;cursor:pointer;}
  .pk-item.full .pk-body{cursor:default;}
  .pk-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pk-name .it-topic{font-size:12.5px;}
  .pk-sub{font-size:11px;color:var(--mute);margin-top:1px;}
  .pk-done{color:var(--green);font-weight:800;font-size:13px;flex:0 0 auto;}
  .pk-exp{flex:0 0 auto;border:none;background:#F3F4F6;color:var(--mute);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;}
  .pk-lec{display:flex;align-items:center;gap:6px;padding:8px 14px 8px 26px;border-bottom:1px solid var(--line);background:#FBFBFD;font-size:12.5px;font-weight:600;cursor:pointer;}
  .pk-lec.full{opacity:.45;cursor:default;}
  .pk-lec .lt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pk-lec .pk-min{margin-left:auto;color:#9CA3AF;font-size:11px;flex:0 0 auto;}
  .pk-subj{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:#fff;cursor:pointer;font-size:13.5px;font-weight:800;}
  .pk-subj:last-child{border-bottom:none;}
  .pk-subj:active{background:#F9FAFB;}
  .pk-subj.open{color:var(--indigo-d);background:#FAFAFF;}
  .pk-subj .ps-cnt{margin-left:auto;color:#6B7280;font-weight:700;font-size:12px;}
  .pk-subj .ps-arrow{color:#6B7280;font-size:14px;flex:0 0 auto;}

  /* ---- toggles / panels ---- */
  .toggles{display:flex;justify-content:center;gap:14px;margin:24px 16px 0;border-top:1px solid var(--line);padding-top:8px;}
  .toggles button{background:none;border:none;color:var(--mute);font-size:13px;font-weight:600;cursor:pointer;padding:8px;font-family:inherit;}
  #statsPanel,#managePanel{margin:10px 16px 0;display:none;}
  #statsPanel.open,#managePanel.open{display:block;}
  .st-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;}
  .st-line:first-child{border-radius:14px 14px 0 0;}
  .st-line:last-child{border-radius:0 0 14px 14px;border-bottom:none;}
  .st-line .v{color:var(--mute);font-weight:700;flex:0 0 auto;text-align:right;}
  .st-head{font-size:11.5px;font-weight:800;color:#9CA3AF;letter-spacing:.4px;padding:12px 14px 4px;background:#fff;border-bottom:1px solid var(--line);}
  .m-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:#fff;}
  .m-item:first-child{border-radius:14px 14px 0 0;}
  .m-item:last-child{border-radius:0 0 14px 14px;border-bottom:none;}
  .m-body{flex:1;min-width:0;}
  .m-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  .m-sub{font-size:11.5px;color:var(--mute);margin-top:2px;}
  .m-sub .tpc{cursor:pointer;color:#8B93C8;font-weight:700;}
  .m-prog{font-size:11px;font-weight:700;color:var(--indigo-d);background:#EEF2FF;padding:3px 8px;border-radius:999px;flex:0 0 auto;cursor:pointer;}
  .m-prog.on{background:var(--indigo);color:#fff;}
  .m-adj{background:#FAFAFF;border-bottom:1px solid var(--line);padding:10px 14px;}
  .adj-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;}
  .adj-lab{font-size:12.5px;font-weight:700;color:#374151;}
  .adj-ctl{display:flex;align-items:center;gap:10px;}
  .adj-ctl b{font-size:13px;font-weight:800;color:var(--indigo-d);min-width:64px;text-align:center;}
  .adj-ctl button{width:30px;height:30px;border:1.5px solid var(--line);background:#fff;border-radius:9px;font-size:17px;font-weight:800;color:var(--indigo);cursor:pointer;font-family:inherit;line-height:1;}
  .adj-ctl button:active{background:#EEF2FF;}
  .adj-ctl button:disabled{opacity:.35;cursor:default;}
  .adj-note{font-size:11px;color:#9CA3AF;margin-top:6px;line-height:1.5;}
  .m-del{flex:0 0 auto;border:none;background:none;color:#CBD5E1;font-size:20px;cursor:pointer;padding:2px 6px;}
  .m-del:active{color:var(--red);}
  .m-empty{padding:18px;text-align:center;color:#9CA3AF;font-size:13px;background:#fff;border-radius:14px;}
  .sheet-tools{display:flex;gap:8px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px;}
  .sheet-tools button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-size:12.5px;font-weight:700;color:#374151;cursor:pointer;font-family:inherit;}
  .sheet-tools button:active{background:#F3F4F6;}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:#111827;color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;z-index:60;box-shadow:0 6px 16px rgba(0,0,0,.3);}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
  /* setup overlay */
  #setup{position:fixed;inset:0;background:rgba(17,24,39,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:18px;}
  #setup.show{display:flex;}
  .sheet{background:#fff;border-radius:20px;max-width:420px;width:100%;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3);position:relative;}
  .sheet-x{position:absolute;top:14px;right:14px;width:32px;height:32px;border:none;background:#F3F4F6;color:var(--mute);border-radius:50%;font-size:20px;line-height:1;cursor:pointer;font-family:inherit;}
  .sheet-x:active{background:#E5E7EB;}
  .sheet h2{margin:0 0 4px;font-size:20px;font-weight:800;}
  .sheet p{margin:0 0 16px;font-size:13px;color:var(--mute);line-height:1.55;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:700;color:#374151;margin:0 2px 5px;}
  .field input:not([type=checkbox]){width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 13px;font-size:15px;outline:none;font-family:inherit;}
  .field input:focus{border-color:var(--indigo);}
  .show-tok input{width:16px;height:16px;flex:0 0 auto;margin:0;accent-color:var(--indigo);}
  .show-tok{font-size:11.5px;color:var(--mute);margin-top:5px;display:flex;align-items:center;gap:5px;}
  .err{color:var(--red);font-size:12.5px;margin:2px 2px 12px;display:none;}
  .err.show{display:block;}
  #connect{width:100%;border:none;background:var(--indigo);color:#fff;font-weight:800;font-size:16px;padding:14px;border-radius:12px;cursor:pointer;margin-top:4px;}
  #connect:active{background:var(--indigo-d);}
  #connect:disabled{opacity:.6;}
  .note{font-size:11px;color:#9CA3AF;text-align:center;margin-top:12px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hd-top">
      <span class="hd-date" id="hdDate"></span>
      <span class="hd-icons">
        <button class="hicon" id="syncBadge" title="동기화"></button>

<script>
/* 간격: GAP[done] = done 단계에 "도달한 뒤" 다음 복습까지의 일수.
   0→1일(D1), 1→2일(D3상당), 2→4일(D7상당), 3→7일(D14상당), 4→14일(D28상당), 5+→35일(유지 무한 반복).
   due는 항목에 직접 저장(롤링 앵커). 수요일 휴식: due가 수요일이면 목요일로. */
const GAP=[1,2,4,7,14,35];
const METHOD=['백지인출','가지 인출','문항 풀이','키워드 스냅','최종 인출','제목 스냅']; // 차수별 복습 방법 (운영 카드 v3)
const OLD_INTERVALS=[1,3,7,14,28]; // 구버전 마이그레이션용
const PATH='data.json', META_PATH='meta.json', CAT_PATH='catalog.json';
const CFG_KEY='review_cfg_v1';
const CACHE_KEY='review_cache_v1';
const META_CACHE='review_meta_v1';
const CAT_CACHE='review_cat_v1';
/* ── 빌트인 연결 (반복 입력 방지) ──────────────────────────────
   owner·repo는 노출돼도 무해하니 박아둠. 토큰만 BUILTIN.token 한 줄.
   ⚠ 레포가 public이면 배포(GitHub 업로드) 전에 token을 ''로 비우세요.
      한 번이라도 셋업/빌트인으로 연결되면 토큰이 이 기기에 저장돼,
      이후엔 BUILTIN.token이 비어도 자동 연결됩니다.
   레포가 private이면 그냥 채워둬도 됩니다(공개 노출 없음).            */
const BUILTIN={ owner:'Somnium1357', repo:'cumulative-review', token:'' };
let cfg=null, sha=null, metaSha=null;
let lectures=[], meta={total:null,deadline:null}, CAT=null;
let judgingId=null, filterSubj='전체', adjOpen=null;
let pkCourse=null, pkOpenSubj=null, pkExp=null;

// ---------- date ----------
const pad=n=>String(n).padStart(2,'0');
function ymd(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function today(){return ymd(new Date());}
function parseYMD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=parseYMD(s);d.setDate(d.getDate()+n);return ymd(d);}
function dayDiff(a,b){return Math.round((parseYMD(a)-parseYMD(b))/86400000);}
const WD=['일','월','화','수','목','금','토'];
function md(s){const d=parseYMD(s);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`;}
function weekStartMon(t){const d=parseYMD(t);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return ymd(d);}

// ---------- model ----------
function schedule(fromYmd,gap){let d=addDays(fromYmd,gap);if(parseYMD(d).getDay()===3)d=addDays(d,1);return d;} // 수요일이면 목요일로
function stageName(done){return done<5?`${done+1}차`:'유지';}
function subjectOf(name){return (String(name).trim().split(/\s+/)[0]||'기타');}
function isPending(l){const t=today();return l.due<=t&&l.lastDone!==t;}
function isDoneToday(l){return l.lastDone===today();}
function stripLec(t){return String(t).replace(/^\[[^\]]+\]\s*/,'').replace(/^\S*강\s*/,'');}
function catLecsOf(name){ // 카탈로그에서 강의 소제목 찾기 (정확명 → 전체, 분할명 → 해당 강의)
  if(!CAT||!Array.isArray(CAT.chunks))return '';
  const ch=CAT.chunks.find(c=>c.n===name);
  if(ch)return ch.l.map(x=>x[0]).join(' · ');
  const m=String(name).match(/^(.+)-(\d+)$/);
  if(m){const b=CAT.chunks.find(c=>c.n===m[1]); if(b&&b.l[m[2]-1])return b.l[m[2]-1][0];}
  return '';
}

function migrate(){ // 구버전 항목에 due/weak/hist/lastResult/topic 부여 (1회, 멱등)
  let changed=false;
  for(const l of lectures){
    if(l.weak===undefined){l.weak=0;changed=true;}
    if(!Array.isArray(l.hist)){l.hist=[];changed=true;}
    if(l.lastResult===undefined){l.lastResult=l.lastDone?'pass':null;changed=true;}
    if(l.topic===undefined){l.topic='';changed=true;}
    if(l.due===undefined){
      if(l.done>=5){l.due=schedule(l.lastDone||l.studied,35);} // 완료분 → 유지 로테이션 편입
      else{let d=addDays(l.studied,OLD_INTERVALS[l.done]);if(parseYMD(d).getDay()===3)d=addDays(d,1);l.due=d;}
      changed=true;
    }
  }
  return changed;
}

// ---------- base64 (UTF-8 safe) ----------
function utf8ToB64(str){const b=new TextEncoder().encode(str);let s='';b.forEach(x=>s+=String.fromCharCode(x));return btoa(s);}
function b64ToUtf8(b64){const bin=atob(b64);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new TextDecoder().decode(a);}

// ---------- config ----------
function detect(){
  const host=location.hostname, parts=location.pathname.split('/').filter(Boolean);
  let owner='',repo='';
  if(host.endsWith('.github.io')){ owner=host.replace('.github.io',''); repo=parts.length?parts[0]:host; }
  return {owner,repo};
}
function loadCfg(){
  try{const v=localStorage.getItem(CFG_KEY);if(v)cfg=JSON.parse(v);}catch(e){}
  // 빌트인 폴백: 저장된 설정이 없거나 토큰이 비어 있으면 빌트인 값으로 채움
  if(!cfg)cfg={owner:'',repo:'',token:''};
  if(!cfg.owner)cfg.owner=BUILTIN.owner;
  if(!cfg.repo)cfg.repo=BUILTIN.repo;
  if(!cfg.token&&BUILTIN.token)cfg.token=BUILTIN.token;
  if(!cfg.owner&&!cfg.repo&&!cfg.token)cfg=null; // 아무것도 없으면 미설정 처리
}
function saveCfg(){try{localStorage.setItem(CFG_KEY,JSON.stringify(cfg));}catch(e){}}

// ---------- GitHub API ----------
function ghHeaders(){return {'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};}
function ghUrl(path){return `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(path)}`;}
async function ghRepoCheck(){
  const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}`,{headers:ghHeaders(),cache:'no-store'});
  if(r.status===401||r.status===403)throw{code:'auth'};
  if(r.status===404)throw{code:'norepo'};
  if(!r.ok)throw{code:'http',status:r.status};
}
async function ghGet(){
  const r=await fetch(ghUrl(PATH),{headers:ghHeaders(),cache:'no-store'});
  if(r.status===404){sha=null;return [];}
  if(r.status===401||r.status===403)throw{code:'auth'};
  if(!r.ok)throw{code:'http',status:r.status};
  const j=await r.json(); sha=j.sha;
  const txt=b64ToUtf8((j.content||'').replace(/\s/g,''));
  return txt.trim()?JSON.parse(txt):[];
}
function mergeById(remote,local){ // 409 충돌 시: id 합집합, hist 긴 쪽(=더 진행된 쪽) 우선
  const m=new Map(); remote.forEach(x=>m.set(x.id,x));
  local.forEach(x=>{const o=m.get(x.id);
    if(!o){m.set(x.id,x);return;}
    m.set(x.id, ((o.hist||[]).length>(x.hist||[]).length)?o:x);
  });
  return [...m.values()];
}
async function ghPut(){
  const mk=()=>({message:'복습 업데이트 '+new Date().toISOString(),content:utf8ToB64(JSON.stringify(lectures,null,2)),...(sha?{sha}:{})});
  let r=await fetch(ghUrl(PATH),{method:'PUT',headers:{...ghHeaders(),'Content-Type':'application/json'},body:JSON.stringify(mk())});
  if(r.status===409){
    const remote=await ghGet();           // 최신 sha 확보 + 원격 상태 회수
    lectures=mergeById(remote,lectures);  // 기기 간 충돌 시 양쪽 보존
    render();
    r=await fetch(ghUrl(PATH),{method:'PUT',headers:{...ghHeaders(),'Content-Type':'application/json'},body:JSON.stringify(mk())});
  }
  if(r.status===401||r.status===403)throw{code:'auth'};
  if(!r.ok)throw{code:'http',status:r.status};
  const j=await r.json(); sha=j.content.sha;
}
async function ghGetMeta(){
  const r=await fetch(ghUrl(META_PATH),{headers:ghHeaders(),cache:'no-store'});
  if(r.status===404){metaSha=null;return {total:null,deadline:null};}
  if(r.status===401||r.status===403)throw{code:'auth'};
  if(!r.ok)throw{code:'http',status:r.status};
  const j=await r.json(); metaSha=j.sha;
  try{const o=JSON.parse(b64ToUtf8((j.content||'').replace(/\s/g,'')));return {total:o.total??null,deadline:o.deadline??null};}
  catch(e){return {total:null,deadline:null};}
}
async function ghPutMeta(){
  const mk=()=>({message:'목표 업데이트 '+new Date().toISOString(),content:utf8ToB64(JSON.stringify(meta,null,2)),...(metaSha?{sha:metaSha}:{})});
  let r=await fetch(ghUrl(META_PATH),{method:'PUT',headers:{...ghHeaders(),'Content-Type':'application/json'},body:JSON.stringify(mk())});
  if(r.status===409){ await ghGetMeta(); r=await fetch(ghUrl(META_PATH),{method:'PUT',headers:{...ghHeaders(),'Content-Type':'application/json'},body:JSON.stringify(mk())}); }
  if(r.status===401||r.status===403)throw{code:'auth'};
  if(!r.ok)throw{code:'http',status:r.status};
  const j=await r.json(); metaSha=j.content.sha;
}
async function ghGetCatalog(){ // 읽기 전용, 없어도 동작
  try{
    const r=await fetch(ghUrl(CAT_PATH),{headers:ghHeaders(),cache:'no-store'});
    if(!r.ok)return null;
    const j=await r.json();
    return JSON.parse(b64ToUtf8((j.content||'').replace(/\s/g,'')));
  }catch(e){return null;}
}

// ---------- sync ----------
const IC_CLOUD='M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z';
const IC_SYNC={
  ok:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC_CLOUD}"/><path d="M9 13.5l2 2 4-4"/></svg>`,
  err:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC_CLOUD}"/><path d="M10.5 11.5l4 4M14.5 11.5l-4 4"/></svg>`,
  spin:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>`
};
function setSync(state){
  const el=document.getElementById('syncBadge'); if(!el)return;
  el.dataset.state=state;
  const busy=state==='loading'||state==='saving';
  el.classList.toggle('spin',busy);
  let icon=IC_SYNC.ok,color='#fff',title='동기화됨';
  if(busy){icon=IC_SYNC.spin;title='동기화 중…';}
  else if(state==='error'){icon=IC_SYNC.err;color='#FCA5A5';title='동기화 실패 — 탭하여 재시도';}
  else if(state==='auth'){icon=IC_SYNC.err;color='#FDE68A';title='GitHub 연결 필요 — 탭하여 설정';}
  el.innerHTML=icon; el.style.color=color; el.title=title;
}
function cacheLocal(){try{
  localStorage.setItem(CACHE_KEY,JSON.stringify(lectures));
  localStorage.setItem(META_CACHE,JSON.stringify(meta));
  if(CAT)localStorage.setItem(CAT_CACHE,JSON.stringify(CAT));
}catch(e){}}

async function save(){
  cacheLocal();
  if(!cfg||!cfg.token){return;}
  setSync('saving');
  try{ await ghPut(); setSync('saved'); }
  catch(e){ setSync(e&&e.code==='auth'?'auth':'error'); }
}
async function saveMeta(){
  cacheLocal();
  if(!cfg||!cfg.token){return;}
  setSync('saving');
  try{ await ghPutMeta(); setSync('saved'); }
  catch(e){ setSync(e&&e.code==='auth'?'auth':'error'); }
}
async function refresh(){
  if(!cfg||!cfg.token)return;
  setSync('loading');
  try{
    lectures=await ghGet();
    meta=await ghGetMeta();
    const c=await ghGetCatalog(); if(c)CAT=c;
    const ch=migrate(); cacheLocal(); setSync('saved'); render();
    if(ch) await save(); // 마이그레이션 결과 1회 영속화
  }
  catch(e){ setSync(e&&e.code==='auth'?'auth':'error'); }
}

// ---------- actions ----------
async function addItem(name,topic,studied){
  lectures.push({id:Date.now()+''+Math.floor(Math.random()*999),name,topic:topic||'',studied,
    done:0,due:schedule(studied,GAP[0]),lastDone:null,lastResult:null,weak:0,hist:[]});
  judgingId=null; render(); toast(`추가: ${name}`); await save();
}
async function addLecture(){
  const nameEl=document.getElementById('name'),topicEl=document.getElementById('topic'),dateEl=document.getElementById('studied');
  const name=nameEl.value.trim();let topic=topicEl.value.trim();const studied=dateEl.value||today();
  if(!name){nameEl.focus();return;}
  if(!topic&&CAT){ // 카탈로그에서 키워드 자동 채움
    const ch=CAT.chunks.find(c=>c.n===name);
    if(ch)topic=ch.t;
    else{const m=name.match(/^(.+)-(\d+)$/);
      if(m){const base=CAT.chunks.find(c=>c.n===m[1]);
        if(base&&base.l[m[2]-1])topic=stripLec(base.l[m[2]-1][0]);}}
  }
  nameEl.value='';topicEl.value='';dateEl.value=today();
  await addItem(name,topic,studied); nameEl.focus();
}
async function pass(id){
  const l=lectures.find(x=>x.id===id); if(!l||!isPending(l))return;
  l.hist.push([today(),l.done,'p']);
  l.done++; l.lastDone=today(); l.lastResult='pass';
  l.due=schedule(today(),GAP[Math.min(l.done,5)]);
  judgingId=null; render(); await save();
}
async function weakAct(id){
  const l=lectures.find(x=>x.id===id); if(!l||!isPending(l))return;
  l.hist.push([today(),l.done,'w']);
  l.weak++; l.lastDone=today(); l.lastResult='weak';   // 단계 동결
  l.due=schedule(today(),1);                            // 내일 재시도
  judgingId=null; render(); await save();
}
function judge(id){ judgingId=(judgingId===id?null:id); render(); }
async function undo(id){
  const l=lectures.find(x=>x.id===id); if(!l||l.lastDone!==today())return;
  const h=l.hist||[];
  if(h.length&&h[h.length-1][0]===today()){
    const e=h.pop();
    if(e[2]==='p')l.done=Math.max(0,l.done-1); else l.weak=Math.max(0,l.weak-1);
    const prev=h[h.length-1];
    l.lastDone=prev?prev[0]:null;
    l.lastResult=prev?(prev[2]==='p'?'pass':'weak'):null;
  }else{ // 구버전 데이터로 오늘 체크한 항목
    l.done=Math.max(0,l.done-1); l.lastDone=null; l.lastResult=null;
  }
  l.due=today(); judgingId=null; render(); await save();
}

// ---------- catalog picker ----------
function catState(ch){
  const names=new Set(lectures.map(x=>x.name));
  if(names.has(ch.n))return 'full';
  let part=0;
  for(let i=0;i<ch.l.length;i++) if(names.has(`${ch.n}-${i+1}`))part++;
  if(ch.l.length&&part>=ch.l.length)return 'full';
  return part>0?'part':'none';
}

function pkOpenS(s){pkOpenSubj=(pkOpenSubj===s?null:s);pkExp=null;renderPicker();}

/* ---- 부하 히트맵: 과거=무채색(수행량), 미래=인디고(예정량), 오늘=남은+수행 ---- */
function dayInfo(ds){
  const t=today();
  let nw=0,p=0,w=0,due=0;
  for(const l of lectures){
    if(l.studied===ds)nw++;
    for(const h of (l.hist||[])) if(h[0]===ds){h[2]==='p'?p++:w++;}
  }
  if(ds>t){ due=lectures.filter(l=>l.due===ds).length; }
  else if(ds===t){ due=lectures.filter(isPending).length; }
  return {nw,p,w,due,total:(ds>t)?due:(nw+p+w+due)};
}
function barDetailText(ds){
  const t=today(), info=dayInfo(ds);
  if(ds>t){
    const by={}; lectures.filter(l=>l.due===ds).forEach(l=>{const k=stageName(Math.min(l.done,5));by[k]=(by[k]||0)+1;});
    const parts=Object.entries(by).map(([k,v])=>`${k} ${v}`).join(' · ');
    return `${md(ds)} — 예정 ${info.due}개${parts?` (${parts})`:''}`;
  }
  if(ds===t)return `오늘 — 남은 ${info.due} · 완료 ${info.p+info.w}${info.nw?` · 신규 ${info.nw}`:''}`;
  return `${md(ds)} — 통과 ${info.p} · 약함 ${info.w}${info.nw?` · 신규 ${info.nw}`:''}`;
}
let selDs=null; // 보기 날짜 (null=오늘)
function barPick(ds){ selDs=(selDs===ds||ds===today())?null:ds; render(); }

function barPeek(ds,target){ barShow(ds,target); }
function barShow(ds,target){ const el=document.getElementById(target); if(!el)return; el.textContent=barDetailText(ds||selDs||today()); }
function renderLoadBars(barsId,detailId,dark){
  const el=document.getElementById(barsId); if(!el)return;
  const t=today(); const days=[]; let max=1;
  for(let i=-7;i<=6;i++){const ds=addDays(t,i),v=dayInfo(ds).total;days.push([ds,v]);if(v>max)max=v;}
  let h='';
  for(const [ds,v] of days){
    const r=v/max, past=ds<t, isT=ds===t, isSel=ds===selDs;
    const hh=v===0?3:Math.round(6+r*30);
    let bg;
    if(isT) bg=dark?'#fff':'#4F46E5';
    else if(v===0) bg=dark?'rgba(255,255,255,.18)':'rgba(17,24,39,.08)';
    else if(past) bg=dark?'rgba(255,255,255,.52)':'rgba(17,24,39,.30)';
    else bg=dark?'rgba(199,210,254,.80)':'rgba(79,70,229,.50)';
    const ring=isSel?(dark?'box-shadow:0 0 0 1.5px rgba(255,255,255,.95);':'box-shadow:0 0 0 1.5px rgba(55,48,163,.9);'):'';
    h+=`<div class="b" style="height:${hh}px;background:${bg};${ring}" onclick="barPick('${ds}')" onmouseover="barPeek('${ds}','${detailId}')"></div>`;
  }
  el.innerHTML=h;
  el.onmouseleave=()=>barShow(null,detailId);
  barShow(null,detailId);
}

/* ---- 페이스 ---- */
function progressDays(from,to){ // 수요일 제외, 양끝 포함
  if(!to||to<from)return 0;
  let c=0,d=from,i=0;
  while(d<=to&&i<500){ if(parseYMD(d).getDay()!==3)c++; d=addDays(d,1); i++; }
  return c;
}
function renderPace(){
  const b=document.getElementById('paceBody');
  const hint=document.getElementById('catHint');
  if(hint)hint.textContent=CAT?`카탈로그 기준 현재 ${CAT.chunks.length}청크 업로드됨 (본강의 ${CAT.chunks.filter(c=>c.c!=='sci').length} · 보충 ${CAT.chunks.filter(c=>c.c==='sci').length})`:'';
  if(meta.total==null||!meta.deadline){
    b.innerHTML=`<div class="pace-empty">목표 미설정 — 탭해서 총 강의량·목표일 입력<span class="edit-mark">✎</span></div>`;
    return;
  }
  const t=today(), n=lectures.length, remain=Math.max(0,meta.total-n);
  const days=progressDays(t,meta.deadline);
  const recent=lectures.filter(l=>{const dd=dayDiff(t,l.studied);return dd>=1&&dd<=7;}).length;
  const rDays=progressDays(addDays(t,-7),addDays(t,-1));
  const rRate=recent/Math.max(1,rDays);
  if(remain===0){
    b.innerHTML=`<div class="pace-big ok">완주 🎉<span class="edit-mark">✎</span></div><div class="pace-sub">${n} / ${meta.total}강 등록 완료</div>`;
    return;
  }
  if(days<=0){
    b.innerHTML=`<div class="pace-big bad">목표일 경과<span class="edit-mark">✎</span></div><div class="pace-sub">잔여 ${remain}강 · 탭해서 목표일 수정</div>`;
    return;
  }
  const need=remain/days, ok=rRate>=need;
  b.innerHTML=
    `<div class="pace-big ${ok?'ok':'bad'}"><span>필요 ${need.toFixed(1)}강/일 ${ok?'✓':'⚠'}</span><span class="edit-mark">✎</span></div>`+
    `<div class="pace-sub">잔여 ${remain} / ${meta.total}강 · 진도일 ${days}일 (~${md(meta.deadline)})</div>`+
    `<div class="pace-sub">최근 7일 신규 ${recent}강 → ${rRate.toFixed(1)}강/일 (${ok?'페이스 유지 중':'페이스 미달'})</div>`;
}

/* ---- 오늘 목록: 차수별 그룹(헤더에 복습 방법) + 완료 구분 ---- */
function recomputeFromHist(l){
  let done=0,weak=0;
  for(const h of (l.hist||[])){ h[1]=done; if(h[2]==='p')done++; else weak++; }
  l.done=done; l.weak=weak;
  const last=(l.hist||[])[l.hist.length-1];
  if(last){
    l.lastDone=last[0]; l.lastResult=last[2]==='p'?'pass':'weak';
    l.due=last[2]==='p'?schedule(last[0],GAP[Math.min(done,5)]):schedule(last[0],1);
  }else{ l.lastDone=null; l.lastResult=null; l.due=schedule(l.studied,GAP[0]); }
}
async function flipHist(id,idx){
  const l=lectures.find(x=>x.id===id); if(!l||!l.hist||!l.hist[idx])return;
  l.hist[idx][2]=l.hist[idx][2]==='p'?'w':'p';
  recomputeFromHist(l);
  render(); toast(`${l.name} → ${l.hist[idx][2]==='p'?'통과':'약함'}로 수정됨`); await save();
}

      }
      h+='</div>';
    }
  }
  cl.innerHTML=h;

function renderList(){

  for(const l of pending){const k=subjectOf(l.name);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(l);}
  let h='<div class="card">';
  for(const k of [...groups.keys()].sort((a,b)=>a.localeCompare(b,'ko'))){
    const arr=groups.get(k).sort((a,b)=>Math.min(a.done,5)-Math.min(b.done,5)||dayDiff(t,b.due)-dayDiff(t,a.due)||a.name.localeCompare(b.name,'ko'));
    h+=`<div class="grp-head">${esc(k)}<b>· ${arr.length}개</b></div>`;
    for(const l of arr){
      const st=Math.min(l.done,5);
      const late=dayDiff(t,l.due);
      const lateP=late>0?`<span class="pill pill-late">${late}일 지남</span>`:'';
      const weakP=l.weak>0?`<span class="pill pill-weak">약함 ${l.weak}</span>`:'';
      const lecsStr=catLecsOf(l.name);
      const topic=(!lecsStr&&l.topic)?` <span class="it-topic">${esc(l.topic)}</span>`:'';
      const lecsH=lecsStr?`<div class="it-lecs">${esc(lecsStr)}</div>`:'';
      const jd=judgingId===l.id;
      h+=`<div class="item ${jd?'judging':''}" onclick="judge('${l.id}')">
        <div class="check">${CHECK}</div>
        <div class="it-body"><div class="it-name">${esc(l.name)}${topic}</div>${lecsH}</div>
        <div class="it-right"><span class="pill pill-stage">${stageName(l.done)} · ${METHOD[st]}</span>${weakP}${lateP}</div></div>`;
      if(jd)h+=`<div class="judge">
        <button class="jw" onclick="event.stopPropagation();weakAct('${l.id}')">${ICO_RETRY}약함</button>
        <button class="jp" onclick="event.stopPropagation();pass('${l.id}')">${ICO_CHECK}통과</button></div>`;
    }
  }
  if(doneToday.length){
    h+=`<div class="grp-head grp-done">오늘 완료<b>· ${doneToday.length}개</b></div>`;
    for(const l of doneToday){
      const wk=l.lastResult==='weak';
      const topic=(!catLecsOf(l.name)&&l.topic)?` <span class="it-topic">${esc(l.topic)}</span>`:'';
      const pill=wk?`<span class="pill pill-weak">${stageName(l.done)} 약함 · 내일 재시도</span>`
                 :`<span class="pill pill-done">${stageName(Math.max(0,l.done-1))} 통과 ✓</span>`;
      h+=`<div class="item done ${wk?'weakr':''}">
        <div class="check" onclick="undo('${l.id}')">${CHECK}</div>
        <div class="it-body"><div class="it-name">${esc(l.name)}${topic}</div><div class="it-meta">${pill}</div></div>
        <span class="undo" onclick="undo('${l.id}')">되돌리기</span></div>`;
    }
  }
  h+='</div>'; cl.innerHTML=h;
}

/* ---- 통계 (hist 파생) ---- */
function renderStats(){
  const p=document.getElementById('statsPanel');
  if(lectures.length===0){p.innerHTML='<div class="m-empty">아직 데이터가 없어요.</div>';return;}
  const ev=[];
  for(const l of lectures){const s=subjectOf(l.name);for(const h of (l.hist||[]))ev.push({d:h[0],st:Math.min(h[1],5),r:h[2],s});}
  const ws=weekStartMon(today());
  const newWeek=lectures.filter(l=>l.studied>=ws).length;
  const evW=ev.filter(e=>e.d>=ws), pW=evW.filter(e=>e.r==='p').length, wW=evW.length-pW;
  const maint=lectures.filter(l=>l.done>=5).length;
  const totWeak=lectures.reduce((a,l)=>a+(l.weak||0),0);
  let h='<div class="card">';
  h+=`<div class="st-line">등록 / 유지 단계<span class="v">${lectures.length}강 / ${maint}강</span></div>`;
  h+=`<div class="st-line">이번 주 (월~)<span class="v">신규 ${newWeek} · 판정 ${evW.length} (통과 ${pW}·약함 ${wW})</span></div>`;
  h+=`<div class="st-line">누적 약함<span class="v">${totWeak}회</span></div>`;
  if(ev.length<10){
    h+=`<div class="st-line" style="color:#9CA3AF">판정 기록이 쌓이면 약함률이 표시돼요<span class="v">${ev.length}/10</span></div>`;
  }else{
    h+=`<div class="st-head">단계별 약함률</div>`;
    for(let st=0;st<=5;st++){
      const a=ev.filter(e=>e.st===st); if(!a.length)continue;
      const w=a.filter(e=>e.r==='w').length;
      h+=`<div class="st-line">${stageName(st)} · ${METHOD[st]}<span class="v">${a.length}회 · 약함 ${Math.round(w/a.length*100)}%</span></div>`;
    }
    h+=`<div class="st-head">과목별 약함률</div>`;
    const by={};
    for(const e of ev){(by[e.s]=by[e.s]||{n:0,w:0});by[e.s].n++;if(e.r==='w')by[e.s].w++;}
    const rows=Object.entries(by).map(([s,v])=>({s,n:v.n,rate:v.w/v.n})).sort((a,b)=>b.rate-a.rate||b.n-a.n);
    for(const r of rows)h+=`<div class="st-line">${esc(r.s)}<span class="v">${r.n}회 · 약함 ${Math.round(r.rate*100)}%</span></div>`;
  }
  h+='</div>'; p.innerHTML=h;
}

function renderManage(){
  const p=document.getElementById('managePanel');
  if(lectures.length===0){p.innerHTML='<div class="m-empty">아직 추가한 강의가 없어요.</div>';return;}
  const s=[...lectures].sort((a,b)=>b.studied.localeCompare(a.studied));let h='';
  for(const l of s){
    const prog=l.done<5?`${l.done}/5`:'유지';
    const wk=l.weak>0?` · 약함 ${l.weak}`:'';
    const tpc=l.topic?esc(l.topic):'키워드 추가';
    const adj=adjOpen===l.id;
    h+=`<div class="m-item"><div class="m-body">
      <div class="m-name" onclick="rename('${l.id}')">${esc(l.name)} <span style="color:#C7D2FE;font-size:11px">✎</span></div>
      <div class="m-sub"><span class="tpc" onclick="editTopic('${l.id}')">${tpc} ✎</span> · 들은날 ${l.studied} · 다음 ${md(l.due)}${wk}</div></div>
      <span class="m-prog ${adj?'on':''}" onclick="adjId('${l.id}')">${prog} ${adj?'▴':'▾'}</span>
      <button class="m-del" onclick="del('${l.id}')">×</button></div>`;
    if(adj){
      h+=`<div class="m-adj">
        <div class="adj-row"><span class="adj-lab">복습 차수</span>
          <div class="adj-ctl"><button onclick="setDone('${l.id}',${l.done-1})" ${l.done<=0?'disabled':''}>−</button>
          <b>${l.done<5?`${l.done}차 완료`:'유지'}</b>
          <button onclick="setDone('${l.id}',${l.done+1})" ${l.done>=6?'disabled':''}>＋</button></div></div>
        <div class="adj-row"><span class="adj-lab">약함 누적</span>
          <div class="adj-ctl"><button onclick="setWeak('${l.id}',${l.weak-1})" ${l.weak<=0?'disabled':''}>−</button>
          <b>${l.weak}회</b>
          <button onclick="setWeak('${l.id}',${l.weak+1})">＋</button></div></div>
        <div class="adj-note">차수를 바꾸면 다음 복습일이 마지막 인출일 기준으로 다시 계산돼요.</div>
      </div>`;
    }
  }
  p.innerHTML=h;
}

let toastT;
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1600);}

// ---------- backup ----------
function exportData(){
  const blob=new Blob([JSON.stringify({meta,items:lectures},null,2)],{type:'application/json'});
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='복습_백업.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);toast('백업 파일 받음');
}
function importData(file){
  const fr=new FileReader();
  fr.onload=async()=>{
    try{
      const obj=JSON.parse(fr.result);
      let gotMeta=false;
      if(Array.isArray(obj)){lectures=obj;}
      else if(obj&&Array.isArray(obj.items)){lectures=obj.items;if(obj.meta){meta={total:obj.meta.total??null,deadline:obj.meta.deadline??null};gotMeta=true;}}
      else{toast('형식 오류');return;}
      migrate(); render(); toast('불러왔어요');
      await save(); if(gotMeta)await saveMeta();
    }catch(e){toast('불러오기 실패');}
  };
  fr.readAsText(file);
}

// ---------- setup ----------
function showSetup(){
  const d=detect();
  document.getElementById('cfgOwner').value=(cfg&&cfg.owner)||d.owner||'';
  document.getElementById('cfgRepo').value=(cfg&&cfg.repo)||d.repo||'';
  document.getElementById('cfgToken').value=(cfg&&cfg.token)||''; // 저장된 토큰 자동 채움
  document.getElementById('cfgToken').type='password';
  document.getElementById('showTok').checked=false;
  document.getElementById('cfgErr').classList.remove('show');
  document.getElementById('setup').classList.add('show');
  setTimeout(()=>document.getElementById('cfgToken').focus(),50);
}
function hideSetup(){
  document.getElementById('setup').classList.remove('show');
  if(!cfg||!cfg.token){ setSync('auth'); toast('⚙︎ 설정에서 언제든 연결할 수 있어요'); }
}
function setupErr(msg){const e=document.getElementById('cfgErr');e.textContent=msg;e.classList.add('show');}
async function connect(){
  const o=document.getElementById('cfgOwner').value.trim();
  const rp=document.getElementById('cfgRepo').value.trim();
  const tk=document.getElementById('cfgToken').value.trim();
  if(!o||!rp||!tk){setupErr('세 칸을 모두 채워주세요.');return;}
  const btn=document.getElementById('connect');btn.disabled=true;btn.textContent='연결 중…';
  const prev=cfg; cfg={owner:o,repo:rp,token:tk};
  try{
    await ghRepoCheck();
    lectures=await ghGet(); meta=await ghGetMeta();
    const c=await ghGetCatalog(); if(c)CAT=c;
    const ch=migrate(); cacheLocal(); saveCfg();
    hideSetup(); setSync('saved'); render(); toast('연결됐어요');
    if(ch) await save();
  }catch(e){
    cfg=prev;
    setupErr(e&&e.code==='auth'?'토큰이 거부됐어요. 권한(Contents: Read and write)과 레포 선택을 확인하세요.'
      :e&&e.code==='norepo'?'레포를 찾을 수 없어요. 사용자명/레포 이름을 확인하세요.':'연결 실패. 네트워크를 확인하세요.');
  }finally{ btn.disabled=false; btn.textContent='연결'; }
}

document.getElementById('jumpDate').addEventListener('change',e=>{

  selDs=(v===today())?null:v; render(); e.target.value='';

document.getElementById('setupClose').addEventListener('click',hideSetup);
document.getElementById('setup').addEventListener('click',e=>{if(e.target.id==='setup')hideSetup();});
document.getElementById('connect').addEventListener('click',connect);
document.getElementById('showTok').addEventListener('change',e=>{document.getElementById('cfgToken').type=e.target.checked?'text':'password';});
document.getElementById('syncBadge').addEventListener('click',()=>{const s=document.getElementById('syncBadge').dataset.state;if(s==='auth')showSetup();else refresh();});
document.getElementById('paceCard').addEventListener('click',togglePaceEdit);
document.getElementById('metaSave').addEventListener('click',e=>{e.stopPropagation();metaSaveAct();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&document.getElementById('syncBadge').dataset.state==='saved')refresh();});

(async function init(){
  document.getElementById('studied').value=today();
  loadCfg();
  try{const v=localStorage.getItem(CACHE_KEY);if(v)lectures=JSON.parse(v)||[];}catch(e){}
  try{const m=localStorage.getItem(META_CACHE);if(m)meta=JSON.parse(m)||meta;}catch(e){}
  try{const c=localStorage.getItem(CAT_CACHE);if(c)CAT=JSON.parse(c);}catch(e){}
  migrate(); render();
  if(!cfg||!cfg.token){ setSync('auth'); showSetup(); return; }
  saveCfg(); // 빌트인으로 채워진 cfg를 이 기기에 저장 → 이후 BUILTIN 비어도 자동 연결
  await refresh();
})();
</script>
